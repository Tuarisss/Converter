[package]
name = "cvrt"
version = "0.1.0"
edition = "2024"
description = "Fast image and video converter written in Rust"

[dependencies]
image = {version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"]}
clap = { version = "4.6.6", features = ["derive"] }
console = "0.16.4"
indicatif = "0.18.6"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"